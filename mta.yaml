_schema-version: '3.2'
ID: plugin
version: 0.0.1
modules:
  - name: plugin-destination-content
    type: com.sap.application.content
    requires:
      - name: plugin-destination-service
        parameters:
          content-target: true
      - name: plugin-repo-host
        parameters:
          service-key:
            name: plugin-repo-host-key
      - name: plugin-uaa
        parameters:
          service-key:
            name: plugin-uaa-key
    parameters:
      content:
        instance:
          destinations:
            - Name: plugin_html_repo_host
              ServiceInstanceName: plugin-html5-srv
              ServiceKeyName: plugin-repo-host-key
              sap.cloud.service: plugin
            - Authentication: OAuth2UserTokenExchange
              Name: plugin_uaa
              ServiceInstanceName: plugin-xsuaa-srv
              ServiceKeyName: plugin-uaa-key
              sap.cloud.service: plugin
          existing_destinations_policy: ignore
    build-parameters:
      no-source: true
  - name: plugin-app-content
    type: com.sap.application.content
    path: .
    requires:
      - name: plugin-repo-host
        parameters:
          content-target: true
    build-parameters:
      build-result: resources
      requires:
        - artifacts:
            - plugin.zip
          name: plugin
          target-path: resources/
  - name: plugin
    type: html5
    path: .
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build:ui
      supported-platforms: []
resources:
  - name: plugin-destination-service
    type: org.cloudfoundry.managed-service
    parameters:
      config:
        HTML5Runtime_enabled: true
        init_data:
          instance:
            destinations:
              - Authentication: NoAuthentication
                Name: ui5
                ProxyType: Internet
                Type: HTTP
                URL: https://ui5.sap.com
            existing_destinations_policy: update
        version: 1.0.0
      service: destination
      service-name: plugin-destination-service
      service-plan: lite
  - name: plugin-uaa
    type: org.cloudfoundry.managed-service
    parameters:
      path: ./xs-security.json
      service: xsuaa
      service-name: plugin-xsuaa-srv
      service-plan: application
  - name: plugin-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-name: plugin-html5-srv
      service-plan: app-host
parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
